<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grafonia Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --teal: #367289;
  --teal-dark: #244f63;
  --teal-light: #4a9ab5;
  --teal-glow: rgba(54,114,137,0.12);
  --bg: #f0f5f8;
  --white: #ffffff;
  --text: #0d1b24;
  --text2: #3d5464;
  --text3: #7a99aa;
  --border: #dde8ee;
  --error: #e53935;
  --radius: 14px;
  --shadow: 0 20px 60px rgba(54,114,137,0.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.bg-blobs{position:fixed;inset:0;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;}
.blob1{width:500px;height:500px;background:var(--teal-light);top:-100px;right:-100px;}
.blob2{width:350px;height:350px;background:var(--teal);bottom:-80px;left:-80px;}
.card{background:var(--white);border-radius:24px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:48px 40px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center;}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--teal),var(--teal-light));border-radius:12px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:24px;height:24px;fill:white;}
.logo-text{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);}
.logo-text span{color:var(--teal);}
h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;text-align:center;}
.sub{font-size:14px;color:var(--text3);text-align:center;margin-bottom:36px;}
.field{margin-bottom:20px;}
label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px;}
input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:var(--white);transition:all .2s;outline:none;}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-glow);}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:44px;}
.pass-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;}
.pass-toggle:hover{color:var(--teal);}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;margin-top:8px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(54,114,137,0.35);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.error-msg{background:#fdecea;border:1px solid #f5c6c6;color:var(--error);padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;display:none;}
.error-msg.show{display:block;}
.back-link{display:block;text-align:center;margin-top:24px;font-size:13px;color:var(--text3);}
.back-link a{color:var(--teal);font-weight:600;text-decoration:none;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="logo-text">Gra<span>fonia</span></div>
  </div>
  <h1>Admin Login</h1>
  <p class="sub">Sign in to manage your Grafonia dashboard</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label for="username">Username or Email</label>
    <input type="text" id="username" placeholder="Enter username or email" autocomplete="username"/>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="pass-wrap">
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
      <button class="pass-toggle" onclick="togglePass()" type="button" title="Show/hide password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>

  <p class="back-link"><a href="/">← Back to website</a></p>
</div>

<script>
  const API = '/api';

  function togglePass() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');

    err.classList.remove('show');
    if (!username || !password) {
      err.textContent = 'Please enter username and password.';
      return err.classList.add('show');
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('grafonia_token', data.token);
      localStorage.setItem('grafonia_admin', JSON.stringify(data.admin));
      window.location.href = '/admin/dashboard.html';
    } catch (e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // Redirect if already logged in
  if (localStorage.getItem('grafonia_token')) {
    window.location.href = '/admin/dashboard.html';
  }
</script>
</body>
</html>
